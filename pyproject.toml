[project]
name = "keynonce-guard"
version = "0.1.0"
description = "Evidence-grounded key and nonce security assurance prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
  "pycryptodome>=3.21,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
keynonce-guard = "keynonce_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keynonce_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["corpus", "work"]
